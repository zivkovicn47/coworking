spring.application.name=coworking

spring.datasource.url=jdbc:h2:mem:coworkingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.show-sql=true

# ================================================================================
#          COWORKING SPACE BOOKING SYSTEM - POSTMAN TEST VODIČ
# ================================================================================
# 1. REGISTRACIJA
# - POST http://localhost:8080/api/auth/register
#   { "username": "clan1", "password": "123", "role": "ROLE_MEMBER" } -> (201 Created)
# - POST http://localhost:8080/api/auth/register
#   { "username": "admin1", "password": "123", "role": "ROLE_ADMIN" } -> (201 Created)
#
# 2. PRIJAVA KAO ADMIN
# - POST http://localhost:8080/api/auth/login
#   { "username": "admin1", "password": "123" } -> (200 OK)
#
# 3. KREIRANJE RADNOG PROSTORA (Admin)
# - POST http://localhost:8080/api/workspaces
#   {
#     "name": "Konferencijska Sala Nikola Tesla",
#     "type": "MEETING_ROOM",
#     "capacity": 10,
#     "hourlyRate": 25.0,
#     "hasProjector": true
#   } -> (201 Created, ID: 1)
#
# 4. PRIJAVA KAO ČLAN
# - POST http://localhost:8080/api/auth/login
#   { "username": "clan1", "password": "123" } -> (200 OK)
#
# 5. REZERVACIJA 1 (Član, npr. 10:00 do 13:00 - 3 sata)
# - POST http://localhost:8080/api/bookings
#   {
#     "workspace": { "id": 1 },
#     "startTime": "2026-09-15T10:00:00",
#     "endTime": "2026-09-15T13:00:00"
#   } -> (201 Created, status "PENDING", totalPrice: 75.0 (3h * 25€))
#
# 6. REZERVACIJA 2 U PREKLAPAJUĆEM TERMINU (11:00 do 14:00)
# - POST http://localhost:8080/api/bookings
#   {
#     "workspace": { "id": 1 },
#     "startTime": "2026-09-15T11:00:00",
#     "endTime": "2026-09-15T14:00:00"
#   } -> (201 Created, ID: 2, status "PENDING")
#
# 7. TEST PRAVILA > 8 SATI (Pokušaj rezervacije na 10 sati)
# - POST http://localhost:8080/api/bookings
#   {
#     "workspace": { "id": 1 },
#     "startTime": "2026-09-16T08:00:00",
#     "endTime": "2026-09-16T18:00:00"
#   } -> 400 Bad Request: "Maksimalno trajanje jedne rezervacije je 8 sati."
#
# 8. ODOBRENJE I KASKADNO ODBIJANJE (Admin)
# - POST http://localhost:8080/api/auth/login (Login kao "admin1")
# - PUT http://localhost:8080/api/bookings/1/status?status=APPROVED -> (200 OK)
# - GET http://localhost:8080/api/bookings
#   -> Rezervacija 1 je "APPROVED", a Rezervacija 2 je automatski postala "REJECTED"!
# ================================================================================